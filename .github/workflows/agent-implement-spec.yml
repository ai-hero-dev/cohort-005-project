name: Agent — Implement A Spec

# ═══════════════════════════════════════════════════════════════════════════
# THE WHOLE FACTORY, IN ONE FILE
#
# Everything before this ran once, on one ticket, because a person put a label
# on it. This one takes a *spec*, turns it into a queue of tickets, and then
# works the queue on its own until there is nothing left in it — and if nobody
# ever labels anything, a clock starts it anyway.
#
# There are two loops here, and they are different loops. Keep them apart in
# your head while you read:
#
#   LOOP ONE — DECOMPOSE.  Runs once per spec. An agent reads the spec issue
#     and writes the queue: N child issues, ordered, each with a "Done when"
#     a reviewer can check. Nothing is built. The output is tickets.
#
#   LOOP TWO — CHAIN.  Runs once per ticket. Take the frontier ticket — the
#     lowest open position whose dependencies are all closed — build it, open
#     a draft PR, then start this workflow again. Finishing one ticket is what
#     triggers the next. That is the chain, and it is four lines at the bottom
#     of this file.
#
# THE SHAPE, AS A PICTURE
#
#   label / cron / self-dispatch
#             │
#             ▼
#        ┌─────────┐   no queue yet    ┌───────────┐
#        │ survey  ├──────────────────►│ decompose │──┐
#        └────┬────┘                   └───────────┘  │
#             │ queue has a frontier ticket           │
#             ▼                                       │
#        ┌───────────┐                                │
#        │ implement │ ──► draft PR ──► agent:review  │
#        └─────┬─────┘                                │
#              │                                      │
#              ▼                                      ▼
#        ┌───────────────────────────────────────────────┐
#        │ chain: gh workflow run (this file, again)     │
#        └───────────────────────────────────────────────┘
#
#   `survey` runs every time and decides which of the two loops this run is.
#   The workflow has no memory between runs; the queue on GitHub is the state.
#   That is the trick — the issues are the program counter.
#
# WHAT IT IS POINTED AT: ADMIN PLATFORM ANALYTICS
#
#   The spec this was built for is the admin platform analytics rollup: revenue
#   and enrolment reporting for the whole platform, over a date range, over the
#   `purchases`, `refunds`, `courses` and `enrollments` tables that are already
#   there. Per-course revenue net of refunds, per-instructor rollups, and a
#   month-by-month trend, read by an admin and nobody else.
#
#   ⚠ `purchases.created_at` and `courses.instructor_id` have NO INDEX, and
#   this workflow is not allowed to add one. Every date-ranged report the queue
#   builds is therefore a full scan, and it gets slower with every seeded row.
#   That is not an oversight and it is not yours to tidy up: the slow-query
#   detector later in this section is supposed to find it, file its own ticket
#   about it, and hand that ticket back to this same queue. Fix it now and you
#   have nothing for the detector to find. The prompt below says so to the
#   agent, in as many words.
#
# WHAT IT NEEDS
#
#   secrets.ANTHROPIC_API_KEY — the agent's auth token.
#   secrets.GITHUB_TOKEN      — supplied by Actions; scoped by `permissions:`.
#   secrets.FACTORY_PAT       — a fine-grained PAT with Issues: write, Contents:
#                               write, Pull requests: write and Actions: write
#                               on this repository. The `chain` job at the
#                               bottom is the only thing that uses it, and it
#                               cannot work without it: a `gh workflow run`
#                               authenticated with the built-in GITHUB_TOKEN
#                               does not start a new workflow run. GitHub
#                               suppresses that to stop a workflow looping on
#                               itself forever — which is, word for word, what
#                               this workflow is trying to do.
# ═══════════════════════════════════════════════════════════════════════════

on:
  # 1. A person opens the queue by labelling the spec issue.
  issues:
    types: [labeled]

  # 2. The clock. Every fifteen minutes it looks at the queue and moves it on
  #    one ticket, whether or not anyone asked. This is the trigger that makes
  #    the factory a thing that runs rather than a thing you run: the queue
  #    drains overnight and you read pull requests in the morning.
  #
  #    Two honest caveats, because they will bite you on the day:
  #      • GitHub schedules are best-effort. A `*/15` cron on a busy hour can
  #        land several minutes late, and the top of the hour is the worst slot
  #        there is. Do not stand in front of a camera waiting for :00.
  #      • GitHub disables scheduled workflows in a repository with no commits
  #        for sixty days, and emails the owner. A quiet repo stops on its own.
  #      • A schedule only ever runs the copy of this file on the *default*
  #        branch, and `github.ref_name` inside a scheduled run is that branch
  #        too. If the factory works on another branch — this course works on
  #        `live-run-through` — the cron does not fire for it at all, and a
  #        chain that inherited `github.ref_name` would walk off the branch on
  #        the first tick. So the `chain` job dispatches a pinned ref: set the
  #        `FACTORY_REF` repository variable to the branch you want worked.
  schedule:
    - cron: "*/15 * * * *"

  # 3. The button, and the chain. `workflow_dispatch` is how a human starts it
  #    without labelling anything — and it is how the `chain` job at the bottom
  #    starts the next ticket. One trigger, two callers.
  workflow_dispatch:
    inputs:
      spec_issue:
        description: "The spec issue number to work. Leave blank to pick up whichever spec is labelled agent:implement-spec."
        required: false
        type: string

permissions:
  contents: write # push the branch for each ticket
  issues: write # write the queue, move labels, report progress
  pull-requests: write # open the draft PR per ticket

# One run of this workflow at a time, repo-wide, and never cancelled. The queue
# is shared state: two runs at once would both pick the same frontier ticket
# and build it twice. `cancel-in-progress: false` matters just as much — a
# cron tick must not kill a build that is halfway through.
concurrency:
  group: agent-implement-spec
  cancel-in-progress: false

jobs:
  # ── survey ────────────────────────────────────────────────────────────────
  # Reads the queue and decides what this run is. No agent, no checkout of
  # consequence — just `gh` and `jq`, so it is cheap enough to run every
  # fifteen minutes forever.
  survey:
    # Label runs are filtered here; cron and dispatch runs carry no label and
    # fall through.
    if: >-
      github.event_name != 'issues' ||
      github.event.label.name == 'agent:implement-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      # 'decompose' | 'implement' | 'drained' | 'no-spec'
      mode: ${{ steps.survey.outputs.mode }}
      spec: ${{ steps.survey.outputs.spec }}
      ticket: ${{ steps.survey.outputs.ticket }}
      remaining: ${{ steps.survey.outputs.remaining }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Whichever of the three triggers fired, the spec number ends up here.
      REQUESTED_SPEC: ${{ github.event.issue.number || inputs.spec_issue }}

    steps:
      - name: Find the spec and the frontier ticket
        id: survey
        run: |
          set -euo pipefail

          # 1. Which spec are we working? The trigger may have named one. A
          #    cron tick did not, so find the open issue that is labelled as
          #    the live spec.
          spec="${REQUESTED_SPEC:-}"
          if [ -z "$spec" ]; then
            spec=$(gh issue list --state open --label "agent:implement-spec" \
              --limit 1 --json number --jq '.[0].number // empty')
          fi
          if [ -z "$spec" ]; then
            echo "No spec is labelled agent:implement-spec. Nothing to do."
            echo "mode=no-spec" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "Working spec #$spec"

          # 2. Does a queue exist for it yet? Every ticket this workflow
          #    writes is labelled `spec:<number>`. No such issues, open or
          #    closed, means the spec has never been decomposed.
          gh issue list --state all --label "spec:${spec}" --limit 100 \
            --json number,title,state,labels,body > /tmp/queue.json
          total=$(jq 'length' /tmp/queue.json)
          if [ "$total" -eq 0 ]; then
            echo "No queue for spec #$spec yet. This run decomposes it."
            echo "mode=decompose" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. The frontier. The lowest open position whose `Depends on:`
          #    positions are all closed. Ticket bodies carry both lines,
          #    written by the decompose loop.
          jq -r '
            [ .[]
              | { number,
                  state,
                  labels: [ .labels[].name ],
                  position: ((.body | capture("Position:\\s*(?<p>[0-9]+)").p // "999") | tonumber),
                  depends: ((.body | capture("Depends on:\\s*(?<d>[0-9, ]*)").d // "")
                             | split(",") | map(gsub("\\s";"")) | map(select(length>0) | tonumber)) }
            ] | sort_by(.position)
          ' /tmp/queue.json > /tmp/queue-sorted.json

          closed_positions=$(jq -c '[ .[] | select(.state=="CLOSED") | .position ]' /tmp/queue-sorted.json)

          # `needs-a-human` is the label the implement job puts on a ticket it
          # could not finish. Such a ticket stays OPEN on purpose — a failure
          # must not drain silently out of the queue — so without this filter
          # every cron tick picks the same broken ticket, forever. Parked means
          # out of the frontier until a person takes the label off.
          ticket=$(jq -r --argjson closed "$closed_positions" '
            [ .[]
              | select(.state=="OPEN")
              | select(.labels | index("needs-a-human") | not)
              | select(all(.depends[]; . as $d | $closed | index($d) != null))
            ] | .[0].number // empty
          ' /tmp/queue-sorted.json)

          parked_count=$(jq '[ .[] | select(.state=="OPEN") | select(.labels | index("needs-a-human")) ] | length' /tmp/queue-sorted.json)
          open_count=$(jq '[ .[] | select(.state=="OPEN") | select(.labels | index("needs-a-human") | not) ] | length' /tmp/queue-sorted.json)
          echo "remaining=$open_count" >> "$GITHUB_OUTPUT"
          if [ "$parked_count" -gt 0 ]; then
            echo "::notice::Spec #$spec has $parked_count ticket(s) parked for a person. Take \`needs-a-human\` off one to put it back in the queue."
          fi

          if [ -z "$ticket" ]; then
            if [ "$open_count" -eq 0 ]; then
              echo "Queue for spec #$spec is drained."
              echo "mode=drained" >> "$GITHUB_OUTPUT"
            else
              # Open tickets exist but every one is blocked. That is a cycle
              # or a ticket waiting on a human, and either way looping on it
              # would burn a run every fifteen minutes forever.
              echo "::warning::Spec #$spec has $open_count open tickets and none are unblocked."
              echo "mode=drained" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Frontier ticket: #$ticket ($open_count open)"
          echo "ticket=$ticket" >> "$GITHUB_OUTPUT"
          echo "mode=implement" >> "$GITHUB_OUTPUT"

  # ── LOOP ONE: decompose ───────────────────────────────────────────────────
  # One spec in, a queue of tickets out. Runs at most once per spec: the
  # moment it creates the first `spec:<n>` issue, `survey` will never choose
  # this mode again.
  decompose:
    needs: survey
    if: needs.survey.outputs.mode == 'decompose'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SPEC: ${{ needs.survey.outputs.spec }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the spec
        run: |
          set -euo pipefail
          gh issue view "$SPEC" --json number,title,body,comments \
            --jq '"# " + .title + "\n\n" + .body' > /tmp/spec.md
          cat /tmp/spec.md

      - name: Read the decomposition schema
        id: schema
        run: |
          set -euo pipefail
          # `--json-schema` takes the schema itself, not a path to one: the CLI
          # parses its argument as JSON and stops at the first `.` of a
          # filename. So hand over the contents, on one line.
          #
          # It goes into `claude_args` inside single quotes, so a single quote
          # in the file would end the quoting and split the argument — with
          # nothing downstream to say the run lost its schema. So say it here.
          if grep -q "'" .github/schemas/spec-decomposition.json; then
            echo "The decomposition schema contains a single quote. Reword it." >&2
            exit 1
          fi
          echo "json=$(jq -c . .github/schemas/spec-decomposition.json)" >> "$GITHUB_OUTPUT"

      - name: Decompose the spec into a queue
        id: decompose
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Reads only. This loop writes tickets, not code, and the next step
          # is what actually creates them — so the agent here needs no write
          # tool at all.
          claude_args: >-
            --max-turns 30
            --json-schema '${{ steps.schema.outputs.json }}'
            --allowedTools "Read,Glob,Grep,Bash(git log*)"
          prompt: |
            You are the decomposer in this repository's software factory. You
            turn one spec into an ordered queue of tickets. You do not write
            code in this run, and there is nowhere for you to write it.

            The spec is in /tmp/spec.md. Read it, then read enough of the
            repository to know where the work lands: AGENTS.md,
            CODING_STANDARDS.md, GLOSSARY.md, app/db/schema.ts, and
            app/services/README.md.

            Cut the spec into tickets on these lines:

            - **One ticket, one module.** A ticket that adds behaviour adds it
              as a deep module under app/services/, behind an entry point a
              test can call, with its tests in the same ticket. Read the
              "Leave the change somewhere a test can reach" rule in
              CODING_STANDARDS.md before you decide what a ticket contains —
              a ticket whose whole diff would land in a loader is a ticket cut
              wrong, and no reviewer will catch it.
            - **The route comes last.** Wiring a finished module into a loader
              and a page is its own ticket, and it depends on the modules.
            - **Name things in GLOSSARY.md's words.** If the spec introduces an
              idea the glossary has no word for, the first ticket in the queue
              is the one that names it.
            - **Order by dependency, not by layer.** `depends_on` holds
              positions, and a ticket with an empty `depends_on` is one that
              could be built in parallel with the others like it. Be honest
              about that: it is the list somebody will use to decide whether
              to run two of these at once.

            One hard constraint, and it will look like a bug to you:

            **Do not write a ticket that adds an index to
            `purchases.created_at` or to `courses.instructor_id`.** Both are
            missing, on purpose. Every date-ranged report over purchases, and
            every per-instructor rollup, is a full table scan as a result, and
            it is supposed to be. Something downstream is meant to find that
            for itself. If you notice it — and you should — say so in a ticket
            body as a known characteristic, and leave it alone.

            Emit the queue as the structured output this run is schema'd for.

      - name: Write the queue as issues
        env:
          TICKETS: ${{ steps.decompose.outputs.structured_output }}
        run: |
          set -euo pipefail
          printf '%s' "$TICKETS" > /tmp/queue.json
          jq '.' /tmp/queue.json

          # Labels this queue uses. Creating them is idempotent enough with
          # `|| true`, and it means a fresh clone of the repo works first time.
          gh label create "spec:${SPEC}" --color BFD4F2 \
            --description "A ticket in the queue for spec #${SPEC}" || true
          gh label create "agent:queued" --color FEF2C0 \
            --description "Waiting for the implement-spec chain" || true

          total=$(jq '.tickets | length' /tmp/queue.json)
          echo "Writing $total tickets for spec #${SPEC}."

          for i in $(seq 0 $((total - 1))); do
            title=$(jq -r ".tickets[$i].title" /tmp/queue.json)
            position=$(jq -r ".tickets[$i].position" /tmp/queue.json)
            shape=$(jq -r ".tickets[$i].shape" /tmp/queue.json)
            depends=$(jq -r ".tickets[$i].depends_on | join(\", \")" /tmp/queue.json)

            # The two machine-read lines. `survey` parses these out of the
            # body on every single run — they are the queue's real state, and
            # they live where a human can read them too.
            {
              echo "Part of #${SPEC}"
              echo ""
              echo "Position: ${position}"
              echo "Depends on: ${depends}"
              echo "Shape: ${shape}"
              echo ""
              echo "---"
              echo ""
              jq -r ".tickets[$i].body" /tmp/queue.json
            } > /tmp/ticket-body.md

            gh issue create \
              --title "$title" \
              --body-file /tmp/ticket-body.md \
              --label "spec:${SPEC}" \
              --label "agent:queued"
          done

          gh issue comment "$SPEC" --body \
            "Decomposed into ${total} tickets, labelled \`spec:${SPEC}\`. The chain takes it from here."

  # ── LOOP TWO: implement one ticket ────────────────────────────────────────
  # Identical in spirit to agent-implement.yml, with one difference that makes
  # it a queue rather than a one-off: it closes the ticket it finished, which
  # is what lets the next run's `survey` step move the frontier forward.
  implement:
    needs: survey
    if: needs.survey.outputs.mode == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SPEC: ${{ needs.survey.outputs.spec }}
      TICKET: ${{ needs.survey.outputs.ticket }}
      BRANCH: agent/spec-${{ needs.survey.outputs.spec }}-ticket-${{ needs.survey.outputs.ticket }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed the database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Claim the ticket
        # Moving the label first is what stops a cron tick that lands during a
        # long build from picking the same ticket up again.
        run: |
          set -euo pipefail
          gh label create "agent:building" --color 0E8A16 \
            --description "The chain is building this right now" || true
          gh issue edit "$TICKET" \
            --remove-label "agent:queued" \
            --add-label "agent:building"
          gh issue comment "$TICKET" --body "Building — [logs](${RUN_URL})."

      - name: Read the ticket and its spec
        run: |
          set -euo pipefail
          gh issue view "$TICKET" --json number,title,body,comments \
            --jq '"# " + .title + "\n\n" + .body' > /tmp/ticket.md
          gh issue view "$SPEC" --json number,title,body \
            --jq '"# Spec: " + .title + "\n\n" + .body' > /tmp/spec.md
          cat /tmp/ticket.md

      - name: Open the branch
        run: |
          set -euo pipefail
          git config user.name "agent-factory[bot]"
          git config user.email "agent-factory[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Build the ticket
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run *),Bash(npx *),Bash(git diff*),Bash(git status*)"
          prompt: |
            You are the implementer in this repository's software factory,
            building one ticket out of a queue.

            - /tmp/ticket.md — the ticket. Build this, and only this.
            - /tmp/spec.md   — the spec it came from, for context. It is NOT
              your scope. Somebody else's ticket covers the rest of it.

            Read AGENTS.md for the verification checks. Read
            CODING_STANDARDS.md and the CODING_STANDARDS.md of every directory
            you edit.

            Rules of this run:
            - Behaviour goes in a deep module under app/services/, behind an
              entry point a test can call, imported only through its entry
              points. Never inline in a loader. See "Leave the change
              somewhere a test can reach".
            - Tests ship in this ticket, not the next one. `npm test` must end
              with more passing tests than it started with.
            - The ticket's "Done when" is what the review workflow will check
              you against. Read it last, before you stop.
            - Run `npm run typecheck`, `npm test` and `npm run build`. Do not
              stop while any is failing.
            - Do not commit, push or open a pull request. Leave the work in the
              working tree.
            - Do not edit anything under .github/.

            One constraint you will be tempted to break:

            **Do not add an index to `purchases.created_at` or to
            `courses.instructor_id`.** They are missing on purpose, the reports
            you are building scan those tables because of it, and that is the
            intended state of this repository today. If your ticket's report is
            slow, it is slow, and you say so in your summary. You do not fix
            it here.

            Write your summary to /tmp/pr-body.md: what the ticket asked for,
            what you built, what you deliberately left out.

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit, push, open the draft PR, ask for review
        id: ship
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "::warning::The agent changed nothing for #${TICKET}."
            echo "shipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "Implement #${TICKET}" -m "Part of #${SPEC}"
          git push --set-upstream origin "$BRANCH"

          title=$(gh issue view "$TICKET" --json title --jq .title)
          [ -s /tmp/pr-body.md ] || echo "Built by the implement-spec chain." > /tmp/pr-body.md
          {
            echo ""
            echo "---"
            echo ""
            echo "Closes #${TICKET}. Part of spec #${SPEC}."
            echo "Built unattended by [this run](${RUN_URL}); nobody has read it yet."
          } >> /tmp/pr-body.md

          gh pr create \
            --draft \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file /tmp/pr-body.md

          echo "shipped=true" >> "$GITHUB_OUTPUT"

      - name: Hand the pull request to the reviewer
        if: steps.ship.outputs.shipped == 'true'
        env:
          # FACTORY_PAT, not GITHUB_TOKEN, and this is the line the whole chain
          # ends on. agent-review.yml triggers on `pull_request: [labeled]`, and
          # a label applied with the built-in token does not fire a workflow —
          # GitHub suppresses that so a workflow cannot trigger itself. With
          # GITHUB_TOKEN the label lands, the run goes green, and the reviewer
          # never wakes: the last link in the chain breaks and says nothing.
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "agent:review" --color 5319E7 \
            --description "Ask the review workflow to read this pull request" || true

          # No `|| true` and no `::warning` fallback here, on purpose. If this
          # fails the factory has stopped at its last hop, and a green tick over
          # a chain that ended is worse than a red one.
          gh pr edit "$BRANCH" --add-label "agent:review"

      - name: Close the ticket and move the queue on
        if: always()
        run: |
          set -euo pipefail
          gh issue edit "$TICKET" --remove-label "agent:building" || true

          if [ "${{ steps.ship.outputs.shipped }}" = "true" ]; then
            # Closing it is what advances the frontier: the next run's survey
            # sees this position as satisfied, and whatever depended on it
            # becomes buildable.
            gh issue close "$TICKET" \
              --comment "Built and opened as a draft PR — [logs](${RUN_URL}). Closing so the queue moves on; the pull request is where the review happens."
          else
            # Left open on purpose. A failed ticket must not silently drain
            # out of the queue, and it must not be retried forever either — so
            # it is parked for a person.
            gh label create "needs-a-human" --color D93F0B \
              --description "The factory stopped here" || true
            gh issue edit "$TICKET" --add-label "needs-a-human"
            gh issue comment "$TICKET" \
              --body "The chain could not finish this one (**${{ job.status }}**) — [logs](${RUN_URL}). Left open and labelled for a person. The queue will skip past it."
          fi

  # ── THE CHAIN ─────────────────────────────────────────────────────────────
  #
  # This is the loop. Four lines of `gh` at the end of a run, starting the same
  # workflow again — which surveys the queue afresh, finds the next frontier
  # ticket, and builds that one. Nothing schedules the queue and nothing holds
  # it in memory. Each run ends by asking for the next.
  #
  # It runs after either loop: after `decompose`, to start building what was
  # just written; after `implement`, to take the next ticket.
  #
  # It stops when `survey` reports `drained` or `no-spec` — that is, when a run
  # looks at the queue and finds nothing to do. The chain has no counter and no
  # limit, so an empty queue is genuinely the only brake on it. That is worth
  # sitting with before you point this at your own repository.
  #
  # It re-dispatches after a *failed* ticket too, and that is deliberate: the
  # implement job parks a ticket it could not finish with `needs-a-human`, and
  # `survey` skips a parked ticket, so the next run moves on to a different one
  # instead of rebuilding the failure. Without that filter this `always()` would
  # be an infinite retry of the same broken ticket, with a cron on top of it.
  chain:
    needs: [survey, decompose, implement]
    if: |
      always() &&
      needs.survey.result == 'success' &&
      contains(fromJSON('["decompose", "implement"]'), needs.survey.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Start the next ticket
        env:
          # FACTORY_PAT, and it has to be. `gh workflow run` authenticated
          # with the built-in GITHUB_TOKEN returns 204 and starts nothing:
          # GitHub refuses to let a workflow trigger a workflow with its own
          # token. A PAT is a different actor, so the run starts.
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          GH_REPO: ${{ github.repository }}
          SPEC: ${{ needs.survey.outputs.spec }}
          FACTORY_REF: ${{ vars.FACTORY_REF || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Spec #${SPEC}: asking for the next ticket on ${FACTORY_REF}."
          # Pinned, not inherited. On a scheduled run `github.ref_name` is the
          # default branch whatever branch you think the factory lives on, so
          # the chain would walk off this branch on the first cron tick. Set the
          # `FACTORY_REF` repository variable to the branch the factory works on
          # (this course works on `live-run-through`); it falls back to the ref
          # of the current run for a label or a button press.
          gh workflow run agent-implement-spec.yml \
            --ref "$FACTORY_REF" \
            --field "spec_issue=${SPEC}"
